# Hawaii DRE adapter — marked vision_only because the real Hawaii license
# search gates results behind a reCAPTCHA. In production, Browserbase's
# integrated solver handles v2/v3. For the demo, the mock site returns a
# CAPTCHA wall which the workflow correctly routes to HITL.

state: HI
version: v1
last_updated: 2026-05-17
maturity: vision_only
search_url: http://127.0.0.1:8804/license_search
search_path: /license_search

selectors:
  license_input: "#license_id"
  submit_button: "button[type='submit']"
  captcha_marker: "[data-captcha-wall]"

ai_fallback_descriptions:
  license_input: "the License ID input"
  submit_button: "the Submit button"

retry_policy:
  max_attempts: 2
  initial_backoff_ms: 2000
  multiplier: 2.0

concurrency_cap: 4
