# California DRE adapter — REAL site.
# https://www2.dre.ca.gov/publicasp/pplinfo.asp
#
# Classic ASP page. Accepts License ID, Licensee Name (last, first), or Company name.
# Disambiguation: license # is mostly unique on CA DRE, but some result pages can
# show multiple licenses for an entity. We still verify name + status to be safe.

state_code: CA
state_full_name: California
version: v1
last_updated: 2026-05-18
maturity: native_adapter
anti_bot_tier: T1                        # plain Playwright works against pplinfo.asp

profile_source:
  joinreal_url_pattern: "https://onereal.com/profile/{slug}"
  joinreal_url_fallbacks:
    - "https://onereal.com/{slug}"
    - "https://onereal.com/{slug}/about"

dre:
  search_url: "https://www2.dre.ca.gov/publicasp/pplinfo.asp?start=1"
  search_method: license_number
  expected_license_types:
    - "Real Estate Salesperson"
    - "Real Estate Broker"
  disambiguation_required: false        # CA DRE returns a single record per license #

  selectors:
    license_input: "input[name='License_id']"
    submit_button: "input[type='submit'][value*='Find']"
    result_table: "table"
    expiration_field_label: "License Expiration Date"
    agent_name_label: "Licensee Name"
    no_results_marker: "text=/No record found|no results/i"

  ai_fallback_descriptions:
    license_input: "the License Identification Number input on the search form"
    submit_button: "the Find button on the search form"
    expiration_field: "the License Expiration Date value on the licensee detail page"
    agent_name_field: "the Licensee Name value on the licensee detail page"

retry_policy:
  max_attempts: 3
  initial_backoff_ms: 1000
  multiplier: 2.0

concurrency_cap: 10
