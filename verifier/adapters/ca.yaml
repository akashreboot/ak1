# California DRE adapter — versioned configuration.
#
# In production this YAML lives in S3, is registered in Postgres with a
# feature flag, canaries to 5% of CA traffic, auto-promotes on success-rate
# metrics. A bug in the field gets fixed by editing YAML — NO code release.
#
# For the live demo the search_url points at our local Flask mock by default.
# Set REAL_DRE_BASE_CA=https://www2.dre.ca.gov to hit the real site.

state: CA
version: v1
last_updated: 2026-05-17
maturity: native_adapter
search_url: http://127.0.0.1:8802/PublicASP/pplinfo.asp
search_path: /PublicASP/pplinfo.asp

selectors:
  license_input: "#sel_LicID"
  submit_button: "button[type='submit']"
  expiration_field: "[data-field='expiration']"
  agent_name_field: "[data-field='name']"
  no_results_marker: "[data-no-results]"

ai_fallback_descriptions:
  license_input: "the License ID input field on the search form"
  submit_button: "the Find button on the search form"
  expiration_field: "the License Expiration Date value on the agent's listing page"
  agent_name_field: "the Licensee Name field on the agent's listing page"

retry_policy:
  max_attempts: 3
  initial_backoff_ms: 1000
  multiplier: 2.0

concurrency_cap: 10
